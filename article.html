    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const detail = document.getElementById('articleDetail');
            if (!slug) {
                detail.innerHTML = '<div class="container"><p>Artikel tidak ditemukan.</p></div>';
                return;
            }
            const { data, error } = await db.from('articles').select('*').eq('slug', slug).eq('is_published', true).single();
            if (error || !data) {
                detail.innerHTML = '<div class="container"><p>Artikel tidak ditemukan.</p></div>';
                return;
            }
            document.title = data.title + ' - SIEC';
            detail.innerHTML = `
                <div class="container">
                    ${data.cover_image ? `<img src="${data.cover_image}" class="article-cover" alt="${data.title}">` : ''}
                    <div class="article-header">
                        <span class="article-category">${data.category}</span>
                        <h1>${data.title}</h1>
                        <p class="article-date"><i class="fas fa-calendar"></i> ${new Date(data.published_at || data.created_at).toLocaleDateString('id-ID', {year:'numeric',month:'long',day:'numeric'})}</p>
                    </div>
                    <div class="article-body ${data.layout_type}">
                        ${data.content}
                    </div>
                    ${data.material_html ? `
                    <section class="material-section">
                        <div class="material-head">
                            <h2><i class="fas fa-chalkboard-teacher"></i> Materi / Slide Pembelajaran</h2>
                            <div class="material-actions">
                                <button class="btn-material primary" onclick="openMaterialNewTab()"><i class="fas fa-expand"></i> Layar Penuh</button>
                                <button class="btn-material ghost" onclick="shareArticle()"><i class="fas fa-share-alt"></i> Bagikan</button>
                            </div>
                        </div>
                        <div class="material-frame-wrap" id="materialWrap">
                            <iframe title="Materi SIEC" sandbox="allow-scripts allow-same-origin allow-popups allow-modals"></iframe>
                        </div>
                        <p class="material-note"><i class="fas fa-info-circle"></i> Materi interaktif dari SIEC. Klik "Layar Penuh" untuk pengalaman presentasi terbaik.</p>
                    </section>` : ''}
                    <div class="article-footer">
                        <a href="index.html#articles" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Kembali ke Artikel</a>
                    </div>
                </div>
            `;

            if (data.material_html) {
                const blob = new Blob([data.material_html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const frame = document.querySelector('#materialWrap iframe');
                if (frame) frame.src = url;
                window._materialBlobUrl = url;
            }
        });

        function openMaterialNewTab() {
            if (window._materialBlobUrl) window.open(window._materialBlobUrl, '_blank');
        }

        async function shareArticle() {
            const url = location.href;
            const title = document.title.replace(' - SIEC', '');
            const text = 'Materi TOEFL dari SIEC: ' + title;
            if (navigator.share) {
                try { await navigator.share({ title: title, text: text, url: url }); } catch (e) { }
            } else {
                window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank');
            }
        }
    </script>
