            -webkit-background-clip: text;

            color: transparent;

            font-weight: 700; font-size: .92rem; text-decoration: none;
            transition: transform .2s, box-shadow .2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #fff; box-shadow: 0 8px 24px rgba(37, 99, 235, .35);

        .btn-wa { background: #22c55e; color: #fff; box-shadow: 0 8px 24px rgba(34, 197, 94, .3); }
        .links { margin-top: 30px; padding-top: 22px; border-top: 1px solid #e2e8f0; font-size: .85rem; color: #94a3b8; }
        .links a { color: #2563eb; font-weight: 600; text-decoration: none; margin: 0 10px; }
        .links a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .code { font-size: 4rem; }
            .card { padding: 36px 24px; }
        }
